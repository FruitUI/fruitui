name: FruitUI contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            browsers: chromium
          - php: '8.5'
            browsers: chromium
          - php: '8.5'
            browsers: firefox
          - php: '8.5'
            browsers: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:2.10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer update --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run build
      - run: npm run test:package
      - run: npm test -- --max-failures=1 --reporter=line
        env:
          FRUITUI_BROWSERS: ${{ matrix.browsers }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results-${{ matrix.php }}-${{ matrix.browsers }}
          include-hidden-files: true
          path: |
            test-results/
            tests/host/.runtime/server.log
